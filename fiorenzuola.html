<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Corti — Fiorenzuola</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiorenzuola">
<meta name="theme-color" content="#1A1A18">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
    --bg: #F5F3EE; --bg2: #EDEAE3;
    --text: #1A1A18; --text2: #6B6860; --text3: #A0A090;
    --border: #D8D4CB;
    --green: #2A7A4B; --green-bg: #EBF5EF;
    --red: #C0392B; --red-bg: #FDECEA;
    --amber: #92600A; --amber-bg: #FEF9EC;
    --accent: #2A6B8A;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  .header { background: var(--text); color: #FFF; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; }
  .header-title { font-size: 16px; font-weight: 500; }
  .header-sub { font-size: 11px; color: #AAA; margin-top: 2px; font-family: var(--mono); }

  .container { max-width: 480px; margin: 0 auto; padding: 12px 14px; }

  .section-title { font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--text2); margin: 20px 2px 8px; }
  .section-title:first-child { margin-top: 2px; }

  .lotto-header {
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 10px 14px;
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .lotto-codice { font-size: 15px; font-weight: 500; font-family: var(--mono); }
  .lotto-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .capannone-banner {
    background: var(--text); color: #FFF; border-radius: var(--radius); padding: 10px 14px;
    margin-bottom: 8px; text-align: center; font-size: 14px; font-weight: 700;
    font-family: var(--mono); letter-spacing: .05em;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
  .stat-box { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; }
  .stat-box.hl { background: var(--green-bg); border-color: #B8DECA; }
  .stat-label { font-size: 9px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--text2); }
  .stat-val { font-size: 15px; font-weight: 500; font-family: var(--mono); margin-top: 2px; }
  .stat-unit { font-size: 9px; font-weight: 400; color: var(--text2); }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--red); }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .btn-mort { padding: 12px; background: var(--red); color: #FFF; border: none; border-radius: var(--radius-lg); font-size: 12px; font-family: var(--font); font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-mort:active { opacity: .85; }

  .group-btn {
    display: block; width: 100%; background: var(--text); color: #FFF; border: none;
    border-radius: var(--radius-lg); padding: 16px 14px; margin-bottom: 10px;
    font-size: 15px; font-weight: 700; font-family: var(--mono); letter-spacing: .05em;
    text-align: left; cursor: pointer;
  }
  .group-btn:active { opacity: .85; }
  .btn-back {
    background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600;
    font-family: var(--font); cursor: pointer; padding: 4px 0; margin-bottom: 10px;
  }

  .row-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: var(--bg2); border-radius: var(--radius);
    margin-bottom: 4px; border: 0.5px solid var(--border);
  }
  .row-data { font-size: 12px; font-weight: 500; }
  .row-info { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .row-capi { font-size: 20px; font-weight: 500; font-family: var(--mono); }
  .row-capi-label { font-size: 10px; color: var(--text2); text-align: right; }
  .row-totale { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 11px; font-family: var(--mono); color: var(--text2); }
  .mort-scroll { max-height: 38vh; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 4px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-box { background: #FFF; border-radius: 16px 16px 0 0; padding: 20px 16px 32px; width: 100%; max-width: 480px; }
  .modal-title { font-size: 14px; font-weight: 500; font-family: var(--mono); }
  .modal-info { font-size: 11px; color: var(--text2); background: var(--bg2); padding: 8px 10px; border-radius: var(--radius); margin: 12px 0; font-family: var(--mono); }
  .field-label { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 4px; }
  .field-input { width: 100%; padding: 9px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font); background: var(--bg); }
  .btn-primary { width: 100%; padding: 13px; border: none; border-radius: var(--radius-lg); font-size: 13px; font-family: var(--font); font-weight: 500; cursor: pointer; margin-top: 16px; color: #FFF; }

  .empty { text-align: center; color: var(--text3); font-size: 13px; padding: 24px 0; }
  .loading { text-align: center; color: var(--text3); font-size: 13px; padding: 60px 0; }
  .divider { border-top: 1px solid var(--border); margin: 16px 0; }

  .toast { display: none; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 12px; font-size: 13px; }
  .toast.ok { background: var(--green-bg); color: var(--green); border: 0.5px solid #B8DECA; }
  .toast.err { background: var(--red-bg); color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div class="header-title" id="header-title">Le Corti — Fiorenzuola</div>
      <div class="header-sub" id="header-agg">Caricamento…</div>
    </div>
    <button id="btn-traduci" onclick="toggleLang()" style="padding:8px 14px;background:#FFF;color:var(--text);border:none;border-radius:var(--radius);font-size:12px;font-family:var(--font);font-weight:600;cursor:pointer;">Traduci</button>
  </div>
</div>

<div class="container">
  <div id="toast" class="toast"></div>
  <div class="section-title" data-t="lottiAttivi">Lotti attivi</div>
  <div id="content"><div class="loading">Caricamento dati…</div></div>
</div>

<!-- MODALE MORTALITÀ -->
<div class="modal" id="modal-mort">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="modal-title" data-t="modalMortTitle">Registra mortalità</div>
      <button onclick="chiudiModal('mort')" style="background:none;border:none;font-size:20px;color:var(--text2);cursor:pointer;">×</button>
    </div>
    <div style="margin:12px 0;">
      <div class="field-label">CAPANNONE</div>
      <select id="m-capannone" class="field-input" style="font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);">
        <option value="cap 3">CAP 3</option>
        <option value="cap 5">CAP 5</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <div class="field-label" data-t="fieldData">DATA</div>
          <input type="date" id="m-data" class="field-input">
        </div>
        <div>
          <div class="field-label" data-t="fieldCapiMorti">N° CAPI MORTI</div>
          <input type="number" id="m-capi" class="field-input" placeholder="es. 2" min="0">
        </div>
      </div>
      <div>
        <div class="field-label" data-t="fieldNote">CAUSA</div>
        <select id="m-note" class="field-input">
          <option value="" data-t="optDefault">— seleziona causa —</option>
          <option value="Scarto" data-t="optScarto">Scarto</option>
          <option value="Abbattuto" data-t="optAbbattuto">Abbattuto</option>
          <option value="Streptococco" data-t="optStreptococco">Streptococco</option>
          <option value="Diarrea" data-t="optDiarrea">Diarrea</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" style="background:var(--red);" onclick="salvaMortalita()" data-t="btnSalvaMort">✓ Salva mortalità</button>
  </div>
</div>

<script src="lecorti-shared.js"></script>
<script>
const NOME_SOCCIDA = 'FIORENZUOLA';


// ── TRADUZIONE IT / PUNJABI ──
let lang = 'it';
const T = {
  it: {
    headerTitle: 'Le Corti — Fiorenzuola',
    translateBtn: 'Traduci',
    lottiAttivi: 'Lotti attivi',
    lotto: 'Lotto',
    presenti: 'presenti',
    capannoneWord: 'CAPANNONE',
    statPresenti: 'Presenti',
    statEntrati: 'Entrati',
    statLettera: 'Lettera DOP',
    capiUnit: 'capi',
    btnMortalita: '🔴 Mortalità',
    btnUscita: '↗ Uscita',
    mortRegistrate: 'Mortalità registrate',
    ingressiRegistrati: 'Ingressi',
    totIngressi: 'Totale ingressi',
    arrivo: 'Arrivo',
    totale: 'Totale',
    usciteRegistrate: 'Uscite registrate',
    totMortalita: 'Totale mortalità',
    totUscito: 'Totale uscito',
    modalMortTitle: 'Registra mortalità',
    modalUscitaTitle: 'Registra uscita',
    fieldCapannone: 'CAPANNONE',
    fieldData: 'DATA',
    fieldDataU: 'DATA',
    fieldCapiMorti: 'N° CAPI MORTI',
    fieldNote: 'CAUSA',
    fieldCapi: 'N° CAPI',
    fieldKg: 'KG TOTALI (opz.)',
    fieldNoteUscita: 'NOTE (opz.)',
    btnSalvaMort: '✓ Salva mortalità',
    btnSalvaUscita: '✓ Salva uscita',
    optDefault: '— seleziona causa —',
    optScarto: 'Scarto',
    optAbbattuto: 'Abbattuto',
    optStreptococco: 'Streptococco',
    optDiarrea: 'Diarrea',
    nessunLotto: 'Nessun lotto attivo.',
  },
  pa: {
    headerTitle: 'ਲੇ ਕੋਰਤੀ — ਫਿਓਰੈਂਜ਼ੂਓਲਾ',
    translateBtn: 'Italiano',
    lottiAttivi: 'ਸਰਗਰਮ ਲਾਟ',
    lotto: 'ਲਾਟ',
    presenti: 'ਮੌਜੂਦ',
    capannoneWord: 'ਸ਼ੈੱਡ',
    statPresenti: 'ਮੌਜੂਦ',
    statEntrati: 'ਦਾਖਲ ਹੋਏ',
    statLettera: 'DOP ਅੱਖਰ',
    capiUnit: 'ਜਾਨਵਰ',
    btnMortalita: '🔴 ਮੌਤ',
    btnUscita: '↗ ਬਾਹਰ',
    mortRegistrate: 'ਦਰਜ ਮੌਤਾਂ',
    ingressiRegistrati: 'ਦਾਖਲੇ',
    totIngressi: 'ਕੁੱਲ ਦਾਖਲੇ',
    arrivo: 'ਆਮਦ',
    totale: 'ਕੁੱਲ',
    usciteRegistrate: 'ਦਰਜ ਨਿਕਾਸ',
    totMortalita: 'ਕੁੱਲ ਮੌਤਾਂ',
    totUscito: 'ਕੁੱਲ ਬਾਹਰ',
    modalMortTitle: 'ਮੌਤ ਦਰਜ ਕਰੋ',
    modalUscitaTitle: 'ਬਾਹਰ ਜਾਣਾ ਦਰਜ ਕਰੋ',
    fieldCapannone: 'ਸ਼ੈੱਡ',
    fieldData: 'ਤਾਰੀਖ',
    fieldDataU: 'ਤਾਰੀਖ',
    fieldCapiMorti: 'ਮਰੇ ਜਾਨਵਰਾਂ ਦੀ ਗਿਣਤੀ',
    fieldNote: 'ਕਾਰਨ',
    fieldCapi: 'ਜਾਨਵਰਾਂ ਦੀ ਗਿਣਤੀ',
    fieldKg: 'ਕੁੱਲ ਕਿਲੋ (ਚੋਣਵਾਂ)',
    fieldNoteUscita: 'ਨੋਟ (ਚੋਣਵਾਂ)',
    btnSalvaMort: '✓ ਸੰਭਾਲੋ',
    btnSalvaUscita: '✓ ਸੰਭਾਲੋ',
    optDefault: '— ਕਾਰਨ ਚੁਣੋ —',
    optScarto: 'ਰੱਦ',
    optAbbattuto: 'ਕਤਲ ਕੀਤਾ',
    optStreptococco: 'ਸਟ੍ਰੈਪਟੋਕੋਕਸ',
    optDiarrea: 'ਦਸਤ',
    nessunLotto: 'ਕੋਈ ਸਰਗਰਮ ਲਾਟ ਨਹੀਂ।',
  }
};
function t(key) { return T[lang][key] || T.it[key] || key; }

function toggleLang() {
  lang = (lang === 'it') ? 'pa' : 'it';
  document.getElementById('header-title').textContent = t('headerTitle');
  document.getElementById('btn-traduci').textContent = t('translateBtn');
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    el.textContent = t(key);
  });
  render();
}

let soccidaId = null;
let allLotti = [], allMortalita = [], allIngressi = [];
let _mortLottoId = null;

async function loadAll() {
  const soccide = await sb('soccide', `?nome=eq.${encodeURIComponent(NOME_SOCCIDA)}`);
  if(!soccide.length) {
    document.getElementById('content').innerHTML = '<div class="empty">Soccida non trovata.</div>';
    return;
  }
  soccidaId = soccide[0].id;

  [allLotti, allMortalita] = await Promise.all([
    sb('lotti', `?soccida_id=eq.${soccidaId}&attivo=eq.true&order=data_ingresso.asc`),
    sb('mortalita', `?order=data_evento.desc`),
  ]);

  const lottiIds = allLotti.map(l => l.id);
  allMortalita = allMortalita.filter(m => lottiIds.includes(m.lotto_id));
  allIngressi = lottiIds.length
    ? await sb('lotti_ingressi', `?lotto_id=in.(${lottiIds.join(',')})&order=data_ingresso.asc`)
    : [];

  document.getElementById('header-agg').textContent = `${allLotti.length} lotto${allLotti.length !== 1 ? 'i' : ''} attivo${allLotti.length !== 1 ? 'i' : ''} · agg. ${new Date().toLocaleDateString('it-IT')}`;
  render();
}

function noteDisplay(note) {
  if(!note) return '';
  const map = { 'Scarto':'optScarto', 'Abbattuto':'optAbbattuto', 'Streptococco':'optStreptococco', 'Diarrea':'optDiarrea' };
  return map[note] ? t(map[note]) : note;
}

// Gruppi di capannoni selezionabili (2/4 = ex sede, 3/5 = sede attuale dopo spostamento)
const GRUPPI_CAPANNONE = [
  { key: '24', label: 'CAPANNONE 2/4', vals: ['cap 2', 'cap 4'] },
  { key: '35', label: 'CAPANNONE 3/5', vals: ['cap 3', 'cap 5'] },
];

let currentView = { lottoId: null, groupKey: null };

function render() {
  if(!allLotti.length) {
    document.getElementById('content').innerHTML = `<div class="empty">${t('nessunLotto')}</div>`;
    return;
  }
  if(currentView.lottoId !== null && currentView.groupKey !== null) {
    renderDetail();
  } else {
    renderList();
  }
}

function renderList() {
  let html = '';
  allLotti.forEach((lotto, idx) => {
    html += `
    ${idx > 0 ? '<div class="divider"></div>' : ''}
    <div class="lotto-sub" style="margin-bottom:8px;">${lotto.provenienza || ''} · ${fmtDateFull(lotto.data_ingresso)}</div>
    ${GRUPPI_CAPANNONE.map(g => `
      <button class="group-btn" onclick="apriGruppo(${lotto.id}, '${g.key}')">📍 ${g.label}</button>
    `).join('')}
    `;
  });
  document.getElementById('content').innerHTML = html;
}

function apriGruppo(lottoId, groupKey) {
  currentView = { lottoId, groupKey };
  render();
}

function tornaLista() {
  currentView = { lottoId: null, groupKey: null };
  render();
}

function renderDetail() {
  const { lottoId, groupKey } = currentView;
  const lotto = allLotti.find(l => l.id === lottoId);
  const group = GRUPPI_CAPANNONE.find(g => g.key === groupKey);

  // Presenti = sempre sul totale del lotto (stessa popolazione, anche se spostata di capannone) —
  // la mortalità va sottratta indipendentemente da dove è stata registrata, mai solo per gruppo
  const ingLotto = allIngressi.filter(i => i.lotto_id === lottoId);
  const totIngLotto = ingLotto.reduce((s,i) => s+(i.capi||0), 0);
  const mortLotto = allMortalita.filter(m => m.lotto_id === lottoId);
  const totMortiLotto = mortLotto.reduce((s,m) => s+(m.capi_morti||0), 0);
  const presenti = (ingLotto.length ? totIngLotto : (lotto.capi_entrati||0)) - totMortiLotto;

  const html = `
    <button class="btn-back" onclick="tornaLista()">‹ ${lang === 'pa' ? 'ਵਾਪਸ' : 'Indietro'}</button>
    <div class="lotto-header">
      <div>
        <div class="lotto-codice" style="font-size:18px;">📍 ${group.label}</div>
        <div class="lotto-sub">${lotto.provenienza || ''} · ${fmtDateFull(lotto.data_ingresso)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:20px;font-weight:600;color:var(--green);font-family:var(--mono);">${fmt(presenti)}</div>
        <div style="font-size:10px;color:var(--text2);">${t('presenti')}</div>
      </div>
    </div>

    <div class="btn-row" style="grid-template-columns:1fr;">
      <button class="btn-mort" onclick="apriModal(${lotto.id}, '${group.key}')">${t('btnMortalita')}</button>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function apriModal(lottoId, groupKey) {
  const group = GRUPPI_CAPANNONE.find(g => g.key === groupKey);
  _mortLottoId = lottoId;
  const sel = document.getElementById('m-capannone');
  sel.innerHTML = group.vals.map(v => `<option value="${v}">${v.toUpperCase()}</option>`).join('');
  sel.value = group.vals[0];
  ['m-capi','m-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-data').value = new Date().toISOString().split('T')[0];
  document.getElementById('modal-mort').style.display = 'flex';
}

function chiudiModal() {
  document.getElementById('modal-mort').style.display = 'none';
}

document.getElementById('modal-mort').addEventListener('click', function(e) { if(e.target === this) chiudiModal(); });

async function salvaMortalita() {
  const data = document.getElementById('m-data').value;
  const capi = parseInt(document.getElementById('m-capi').value) || 0;
  const note = document.getElementById('m-note').value || null;
  const capannone = document.getElementById('m-capannone').value;
  if(!data || capi <= 0) { showToast('Inserisci data e numero capi morti', false); return; }

  const lotto = allLotti.find(l => l.id === _mortLottoId);

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/mortalita`, {
      method: 'POST', headers: SB_H,
      body: JSON.stringify({
        lotto_id: _mortLottoId, soccida: NOME_SOCCIDA, data_evento: data,
        lettera_dop: lotto?.lettera_dop || null, capi_morti: capi, note, capannone
      })
    });
    if(!r.ok) throw new Error(await r.text());
    const nuova = await r.json();
    if(Array.isArray(nuova)) allMortalita.push(...nuova); else allMortalita.push(nuova);
    chiudiModal();
    showToast(`✓ Mortalità registrata — ${capi} capi il ${fmtDate(data)}`, true);
    render();
  } catch(e) {
    showToast('Errore: ' + e.message, false);
  }
}

loadAll();
</script>
</body>
</html>
