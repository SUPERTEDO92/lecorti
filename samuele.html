<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Corti — Samuele</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samuele">
<meta name="theme-color" content="#1A1A18">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --bg: #F5F3EE; --bg2: #EDEAE3; --bg3: #E3DFD6;
    --text: #1A1A18; --text2: #6B6B66; --text3: #9C9C96;
    --accent: #C17B2A; --accent2: #E8A84A;
    --green: #2A7A4A; --green-bg: #E8F5EE;
    --amber: #9A6010; --amber-bg: #FDF3E0;
    --red: #A03030; --red-bg: #FCEAEA;
    --border: #D4D0C8; --border2: #C4C0B8;
    --font: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
    --radius: 6px; --radius-lg: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; padding-bottom: 40px; }

  .topbar { position: sticky; top: 0; z-index: 250; background: var(--text); color: #F5F3EE; padding-top: env(safe-area-inset-top); }
  .topbar-title { padding: 12px 20px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .topbar-logo { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .1em; white-space: nowrap; }
  .topbar-date { font-size: 11px; color: #888; font-family: var(--mono); white-space: nowrap; }
  @media (max-width: 370px) { .topbar-date { display: none; } .topbar-logo { font-size: 14px; letter-spacing: .06em; } .solo-largo { display: none; } .stat-label { letter-spacing: 0; } .incr-banner { font-size: 11px; padding: 7px 10px; } }
  .topbar-menu-btn {
    background: rgba(255,255,255,.08); border: 0.5px solid rgba(255,255,255,.18);
    color: #F5F3EE; font-family: var(--mono); font-size: 12px;
    padding: 5px 12px; border-radius: 20px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .topbar-menu-btn .chev { display:inline-block; transition: transform .25s ease; font-size: 9px; }
  .topbar-menu-btn.open .chev { transform: rotate(180deg); }
  .topbar-nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px 12px; max-height: 200px; overflow: hidden; transition: max-height .25s ease, padding .25s ease, opacity .2s ease; opacity: 1; }
  .topbar-nav.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
  .nav-btn { background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.14); color: #D8D4CB; font-family: var(--font); font-size: 12.5px; font-weight: 500; padding: 7px 13px; border-radius: 20px; cursor: pointer; }
  .nav-btn.active { background: #F5F3EE; color: var(--text); border-color: #F5F3EE; }

  .container { max-width: 480px; margin: 0 auto; padding: 14px 14px 0; }

  /* Lista soccide, come home index */
  .soccide-list { display: flex; flex-direction: column; gap: 2px; }
  .soccida-card {
    background: #FFF; border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: all .12s;
  }
  .soccida-card:hover { border-color: var(--border2); background: var(--bg2); }
  .soccida-card:active { transform: scale(.985); }
  .soccida-card.spenta { opacity: .5; cursor: default; }
  .soccida-card.spenta:hover { border-color: var(--border); background: #FFF; }
  .soccida-card.spenta:active { transform: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--accent); }
  .dot-gray { background: var(--text3); }
  .soc-main { flex: 1; min-width: 0; }
  .soc-nome { font-size: 14px; font-weight: 500; }
  .soc-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .soc-badge { font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-gray { background: var(--bg3); color: var(--text2); }
  .soc-arrow { color: var(--text3); font-size: 18px; }
  .soccida-card.manuali { background: var(--text); border-color: var(--text); color: #F5F3EE; margin-bottom: 8px; }
  .soccida-card.manuali:hover { background: #2A2A27; border-color: #2A2A27; }
  .soccida-card.manuali .soc-meta, .soccida-card.manuali .soc-arrow { color: #B8B4AB; }
  /* tabella tatuaggio prosciutto sotto le soccide */
  .tatuaggio { margin-top: 8px; }
  .tatuaggio .soccida-card .soc-arrow { transition: transform .25s ease; }
  .tatuaggio.aperto .soccida-card { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .tatuaggio.aperto .soccida-card .soc-arrow { transform: rotate(90deg); }
  .tat-corpo { display: none; background: #FFF; border: 0.5px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 8px 10px 10px; }
  .tatuaggio.aperto .tat-corpo { display: block; }
  .tat-griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tat-col { border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .tat-riga { display: grid; grid-template-columns: 30px 1fr 1fr; align-items: center; border-bottom: 0.5px solid var(--border); font-size: 11px; }
  .tat-riga:last-child { border-bottom: none; }
  .tat-riga.testa { background: var(--bg2); font-size: 8.5px; font-family: var(--mono); text-transform: uppercase; color: var(--text2); letter-spacing: .03em; }
  .tat-riga > span { padding: 5px 4px; text-align: center; }
  .tat-lettera { background: #8A8A86; color: #FFF; font-weight: 700; font-size: 16px; font-family: var(--font); align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .tat-riga.testa .tat-lettera { background: var(--bg2); color: var(--text2); font-size: 8.5px; }
  .tat-carico { font-weight: 600; }
  @media (max-width: 370px) { .tat-griglia { grid-template-columns: 1fr; } }

  /* Header sticky pagina dettaglio */
  .detail-sticky-wrap { position: sticky; top: var(--topbar-h, 0px); z-index: 90; background: var(--bg); padding-bottom: 4px; margin: -14px -14px 10px; padding-left: 14px; padding-right: 14px; padding-top: 14px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: #FFF; cursor: pointer;
    background: #2A6B8A; border: none; font-family: var(--font);
    padding: 7px 13px; border-radius: var(--radius); margin-bottom: 8px;
  }
  .soccida-header { background: var(--text); color: #F5F3EE; border-radius: var(--radius-lg); padding: 10px 16px; }
  .soccida-title { font-size: 17px; font-weight: 500; font-family: var(--mono); }
  .soccida-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .btn-mappa { background: transparent; color: #F5F3EE; border: 1px solid rgba(245,243,238,.45); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-family: var(--font); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn-mappa:active, .btn-mappa:hover { background: rgba(245,243,238,.12); }
  .mappa-list { margin-top: 8px; display: none; }
  .mappa-list.open { display: block; }
  .mappa-item { display: block; width: 100%; text-align: left; background: rgba(245,243,238,.08); color: #F5F3EE; border: none; border-radius: 8px; padding: 7px 10px; margin-top: 4px; font-size: 12px; font-family: var(--font); cursor: pointer; }

  .lotto-header {
    background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 9px 14px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .lotto-codice { font-size: 16px; font-weight: 600; font-family: var(--mono); }
  .lotto-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }

  .capannone-banner { background: var(--text); color: #FFF; border-radius: var(--radius); padding: 9px 14px; margin-bottom: 8px; text-align: center; font-size: 13px; font-weight: 700; font-family: var(--mono); letter-spacing: .05em; }

  /* 3 riquadri per riga come in index.html: entrati · presenti · giorni / peso arrivo · peso stimato · mortalità */
  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-bottom: 6px; }
  .stat-box { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 6px 9px; min-width: 0; }
  .stat-box.hl { background: var(--green-bg); border-color: #B8DECA; }
  .stat-label { font-size: 9px; color: var(--text2); font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-val { font-size: 16px; font-weight: 500; color: var(--text); margin-top: 0; white-space: nowrap; }
  .stat-val.green { color: var(--green); }
  .stat-unit { font-size: 11px; color: var(--text2); font-weight: 300; }

  .section-label { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin: 8px 0 4px; }

  .ltab { flex: 1; padding: 6px 4px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 12px; font-family: var(--font); font-weight: 500; cursor: pointer; }
  /* MANGIME — stessa riga riepilogo consegne di index.html (renderMangimeRow) */
  .mangime-wrap { margin: 8px 0 10px; background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
  .mangime-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; font-size: 12px; font-family: var(--font); cursor: pointer; color: var(--text); }
  .mangime-row > span:last-child { text-align: right; }
  .mangime-arrow { display: inline-block; color: var(--text2); transition: transform .2s; }
  .mangime-wrap.open .mangime-arrow { transform: rotate(90deg); }
  .mangime-list { display: none; border-top: 0.5px solid var(--border); max-height: 320px; overflow-y: auto; }
  .mangime-wrap.open .mangime-list { display: block; }
  .mangime-item { padding: 7px 12px; border-bottom: 0.5px solid var(--border); font-size: 11px; }
  .mangime-item:last-child { border-bottom: none; }
  .mangime-item-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); }
  .mangime-item-desc { color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltab-active { border-color: var(--accent) !important; background: var(--accent) !important; color: #FFF !important; }

  .simple-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 0.5px solid var(--border); background: #FFF; }
  .simple-row:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .simple-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .simple-container { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 8px; }
  .simple-date { font-size: 12px; font-family: var(--mono); font-weight: 500; }
  .simple-peso { font-size: 14px; font-weight: 600; font-family: var(--mono); color: var(--text); white-space: nowrap; }
  .simple-row > :first-child { min-width: 0; }
  .simple-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* righe uscite come in index.html (solo capi, peso, giorni, incremento: niente importi) */
  .uscite-container { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 8px; }
  .uscita-row { padding: 6px 12px; border-bottom: 0.5px solid var(--border); }
  .uscita-row:last-child { border-bottom: none; }
  .uscita-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .uscita-date { font-size: 11px; font-weight: 500; color: var(--text); font-family: var(--mono); min-width: 0; }
  .uscita-line { display: flex; gap: 0; }
  .uc { flex: 1; min-width: 0; }
  .uc.narrow { flex: .65; }
  .uc-label { font-size: 9px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; }
  .uc-val { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uc-val.green { color: var(--green); }
  /* elenchi lunghi (mortalità, note): scorrono dentro il riquadro invece di allungare la pagina */
  .lista-scroll { max-height: 290px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .lista-scroll.note { max-height: 380px; }
  .lista-conta { font-size: 10px; font-family: var(--mono); color: var(--text3); text-align: right; margin: -6px 2px 6px; }
  .incr-banner { display: flex !important; justify-content: space-between; align-items: center; gap: 6px; white-space: nowrap; width: 100%; margin-bottom: 6px; padding: 7px 12px; background: var(--accent); color: #FFF; border: none; border-radius: var(--radius); font-size: 12px; font-family: var(--mono); font-weight: 500; cursor: pointer; text-align: left; display: block; }
  .empty { text-align: center; padding: 12px; color: var(--text3); font-size: 12px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 13px; font-family: var(--mono); }

  .btn-mort { width: 100%; padding: 9px; background: var(--red); color: #FFF; border: none; border-radius: var(--radius-lg); font-size: 13px; font-family: var(--font); font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  .btn-mort:disabled { opacity: .55; cursor: wait; }
  .btn-doc { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; padding: 3px 8px; font-size: 11px; color: var(--text2); cursor: pointer; font-family: var(--font); white-space: nowrap; }
  .field-label { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 4px; }
  .field-input { width: 100%; padding: 9px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 16px; font-family: var(--font); background: var(--bg); color: var(--text); margin-bottom: 8px; }
  .form-box { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }

  .incr-bar { background: var(--accent); color: #FFF; border-radius: var(--radius-lg); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .incr-val { font-size: 16px; font-weight: 600; font-family: var(--mono); }
  .incr-edit-btn { background: rgba(255,255,255,0.2); border: none; color: #FFF; padding: 6px 12px; border-radius: var(--radius); font-size: 12px; font-family: var(--font); cursor: pointer; }

  .toast { display: none; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 12px; font-size: 13px; }
  .toast.ok { background: var(--green-bg); color: var(--green); border: 0.5px solid #B8DECA; }
  .toast.err { background: var(--red-bg); color: var(--red); }

  /* ── MANDRIA DI MAIALINI + TENDA — transizione apertura soccida (03/08/2026: portata su GSAP,
     un tween per maialino, come index.html — dimensioni allineate dopo il bug "invisibili") ── */
  .piglet-herd { position: fixed; inset: 0; z-index: 300; pointer-events: none; }
  .piglet-herd span {
    position: absolute; left: -80px; top: 0;
    will-change: transform, opacity;
  }
  .samuele-curtain {
    position: fixed; left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    z-index: 200; overflow: hidden;
    background: var(--bg);
    pointer-events: none;
    --wipe2: -45%;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent calc(var(--wipe2) - 45%), black var(--wipe2), black 100%);
    mask-image: linear-gradient(to right, transparent 0%, transparent calc(var(--wipe2) - 45%), black var(--wipe2), black 100%);
  }
  .samuele-curtain-inner { position: relative; padding: 14px 14px 40px; }
  .samuele-curtain-sfondo { position: absolute; object-fit: cover; object-position: center center; opacity: .15; pointer-events: none; }
</style>
</head>
<body>

<div class="piglet-herd" id="piglet-herd"></div>

<img src="img/bg-home-piglets.jpg" alt="" style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; opacity:.15; z-index:-2; pointer-events:none;">

<div class="topbar">
  <div class="topbar-title">
    <span class="topbar-logo">LE CORTI — SAMUELE</span>
    <button class="topbar-menu-btn" id="topbar-menu-btn" onclick="toggleTopbarNav()">Menu <span class="chev">▾</span></button>
    <span class="topbar-date" id="topbar-date"></span>
  </div>
  <div class="topbar-nav collapsed" id="topbar-nav">
    <button class="nav-btn active" id="nav-soccide" onclick="vaiA('soccide')">Soccide</button>
    <button class="nav-btn" id="nav-macelli" onclick="vaiA('macelli')">🏭 Macelli</button>
    <button class="nav-btn" id="nav-manuali" onclick="vaiA('manuali')">📚 Manuali</button>
  </div>
</div>

<div class="container">
  <div id="content"><div class="loading">Caricamento dati…</div></div>
</div>

<script src="lecorti-shared.js"></script>
<script>
// Soccide di Samuele: nome nel DB → nome mostrato (CATERINA = Cascina Santa Caterina, aggiunta 16/11/2026)
const SOCCIDE_MOSTRATE = ['FILIPPINI', 'MIGLIORATI', 'SCARATTI', 'CATERINA'];
const ETICHETTE = { CATERINA: 'SANTA CATERINA' };
const etichetta = nome => ETICHETTE[nome] || nome;

// SVG maialino disegnato da zero (nessuna licenza esterna) — sostituisce l'emoji 🐖
// (bug di rendering su Firefox Android con emoji color-font flippate+animate).
const PIG_SVG = '<svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;"><ellipse cx="52" cy="40" rx="34" ry="24" fill="#F2A6A0"/><ellipse cx="20" cy="24" rx="10" ry="9" fill="#F2A6A0"/><ellipse cx="17" cy="21" rx="4.5" ry="4" fill="#D97D78"/><circle cx="34" cy="30" r="3" fill="#2A2622"/><ellipse cx="14" cy="42" rx="15" ry="13" fill="#EF9791"/><ellipse cx="9" cy="40" rx="3" ry="4" fill="#2A2622"/><ellipse cx="9" cy="46" rx="3" ry="4" fill="#2A2622"/><path d="M84 30 Q94 24 90 34 Q96 38 86 38" fill="none" stroke="#EF9791" stroke-width="4" stroke-linecap="round"/><ellipse cx="46" cy="60" rx="6" ry="4" fill="#D97D78"/><ellipse cx="66" cy="60" rx="6" ry="4" fill="#D97D78"/></svg>';

let allSoccide = [], allLotti = [], allUscite = [], allMortalita = [], allIngressi = [], allNoteVet = [], allTrasferimenti = [], allSanitario = [], allMangime = [], allDaPesare = [], allMappe = [];
let vistaPesi = false;
let soccidaAttiva = null;
const tabAttiva = {};   // lotto_id → 'mortalita' | 'referti' | 'note' (resta aperta dopo un salvataggio)

// date locali (toISOString dà la data UTC: tra mezzanotte e l'1/2 di notte proponeva il giorno prima)
function oggiISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function giorniDa(iso) {
  if (!iso) return 0;
  const [a, m, g] = iso.split('-').map(Number);
  const oggi = new Date();
  return Math.round((new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate()) - new Date(a, m - 1, g)) / 86400000);
}
const esc = s => escHtml(s ?? '');
const capi = n => `${fmt(n)} ${Math.abs(n) === 1 ? 'capo' : 'capi'}`;

// presenti = entrati − morti − usciti − trasferiti (stessa formula del gestionale)
function contiLotto(lotto) {
  const ing = allIngressi.filter(i => i.lotto_id === lotto.id);
  const entrati = ing.length ? ing.reduce((s, i) => s + (i.capi || 0), 0) : (lotto.capi_entrati || 0);
  const morti = allMortalita.filter(m => m.lotto_id === lotto.id).reduce((s, m) => s + (m.capi_morti || 0), 0);
  const usciti = allUscite.filter(u => u.lotto_id === lotto.id).reduce((s, u) => s + (u.capi || 0), 0);
  const trasferiti = allTrasferimenti.filter(t => t.lotto_id === lotto.id).reduce((s, t) => s + (t.capi || 0), 0);
  return { entrati, morti, usciti, trasferiti, presenti: entrati - morti - usciti - trasferiti };
}

// peso medio all'arrivo e peso stimato oggi: per ogni arrivo peso medio + incremento × giorni dal suo arrivo,
// media pesata sui capi (come le righe arrivo di index.html)
function pesiLotto(lotto, ingressi) {
  const righe = ingressi.filter(i => i.capi && i.kg).map(i => ({ capi: i.capi, media: i.kg / i.capi, gg: giorniDa(i.data_ingresso) }));
  if (!righe.length && lotto.media_ingresso) righe.push({ capi: 1, media: +lotto.media_ingresso, gg: giorniDa(lotto.data_ingresso) });
  if (!righe.length) return { arrivo: null, oggi: null };
  const tot = righe.reduce((s, r) => s + r.capi, 0);
  const arrivo = righe.reduce((s, r) => s + r.capi * r.media, 0) / tot;
  const inc = lotto.incremento_giornaliero;
  const oggi = inc ? righe.reduce((s, r) => s + r.capi * (r.media + inc * r.gg), 0) / tot : null;
  return { arrivo, oggi };
}

// giorni e incremento di un'uscita, come in index.html (calcGg / calcIncr)
function ggUscita(u, lotto) {
  if (u.giorni_permanenza) return u.giorni_permanenza;
  if (!lotto.data_ingresso || !u.data_uscita) return null;
  return Math.round((new Date(u.data_uscita) - new Date(lotto.data_ingresso)) / 86400000);
}
function incrUscita(u, lotto) {
  if (u.incremento) return u.incremento;
  const gg = ggUscita(u, lotto);
  if (!gg || !u.kg_totali || !u.capi || !lotto.media_ingresso) return null;
  const v = (u.kg_totali / u.capi - lotto.media_ingresso) / gg;
  return v > 0 ? v : null;   // es. scarti leggeri usciti presto: un incremento negativo non ha senso
}

// ── Transizione: la pagina vecchia resta sopra come una tenda che si apre da sinistra a destra,
// mentre passa la mandria di maialini. La tenda non è cliccabile (i tocchi vanno alla pagina nuova)
// e una nuova transizione chiude subito quella in corso (niente tende doppie con i tocchi veloci).
let _transizione = null;
function chiudiTransizione() {
  if (!_transizione) return;
  const { curtain, herd, tweens } = _transizione;
  tweens.forEach(t => t.kill());
  curtain.remove();
  if (herd) { gsap.killTweensOf(herd.querySelectorAll('span')); herd.innerHTML = ''; }
  _transizione = null;
}
function transizioneMandria(azione) {
  const content = document.getElementById('content');
  const herd = document.getElementById('piglet-herd');
  const senzaAnimazione = typeof gsap === 'undefined' || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (typeof gsap !== 'undefined') chiudiTransizione();
  if (senzaAnimazione) { azione(); window.scrollTo(0, 0); return; }

  // tenda: copia della pagina com'era, sotto la barra in alto e alla stessa altezza di scorrimento
  const topbarBottom = Math.max(0, document.querySelector('.topbar').getBoundingClientRect().bottom);
  const curtain = document.createElement('div');
  curtain.className = 'samuele-curtain';
  curtain.style.top = topbarBottom + 'px';
  curtain.setAttribute('aria-hidden', 'true');
  const inner = document.createElement('div');
  inner.className = 'samuele-curtain-inner';
  inner.innerHTML = content.innerHTML;
  inner.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));   // niente id doppi nella pagina
  const sticky = inner.querySelector('.detail-sticky-wrap');
  if (sticky) sticky.style.position = 'static';
  inner.style.transform = `translateY(${-(window.scrollY)}px)`;
  // stessa foto di sfondo della pagina, allineata allo schermo: la tenda non si vede come un riquadro pieno
  const sfondo = document.createElement('img');
  sfondo.src = 'img/bg-home-piglets.jpg'; sfondo.alt = '';
  sfondo.className = 'samuele-curtain-sfondo';
  const largh = Math.min(window.innerWidth, 480);
  sfondo.style.cssText = `left:${-(window.innerWidth - largh) / 2}px;top:${-topbarBottom}px;width:${window.innerWidth}px;height:${window.innerHeight}px;`;
  curtain.appendChild(sfondo);
  curtain.appendChild(inner);
  // pagina scorsa: l'intestazione fissa del dettaglio resta in alto anche nella tenda
  if (sticky && window.scrollY > 0) {
    const fermo = sticky.cloneNode(true);
    fermo.style.cssText = 'position:absolute;top:0;left:0;right:0;margin:0;';
    curtain.appendChild(fermo);
  }
  document.body.appendChild(curtain);

  azione();
  window.scrollTo(0, 0);

  const tweens = [];
  tweens.push(gsap.fromTo(curtain, { '--wipe2': '-45%' }, {
    '--wipe2': '145%', duration: 0.9, ease: 'power2.inOut',
    onComplete: () => { curtain.remove(); },
  }));

  // 3 protagonisti (capobranco + 2 dietro, con galoppo) + 2 comparse leggere sullo sfondo
  // (semplice traslazione, niente rimbalzo), coerente con index.html
  const CONFIG = [
    { top: 40, size: 128, star: true },
    { top: 56, size: 92,  star: true },
    { top: 63, size: 80,  star: true },
    { top: 22, size: 46,  star: false },
    { top: 80, size: 40,  star: false },
  ];
  herd.innerHTML = CONFIG.map(c => `<span style="top:${c.top}%;width:${c.size}px;height:${Math.round(c.size * 0.7)}px;">${PIG_SVG}</span>`).join('');
  const piglets = Array.from(herd.querySelectorAll('span'));
  const runX = window.innerWidth + 200;
  let maxEnd = 0, starIdx = 0, extraIdx = 0;

  piglets.forEach((p, i) => {
    if (CONFIG[i].star) {
      const delay = starIdx * 0.13;
      const dur = 1.05 + starIdx * 0.18;
      gsap.set(p, { x: 0, y: 0, scaleX: -1, opacity: 0 });
      tweens.push(gsap.timeline({ delay })
        .to(p, { opacity: 1, duration: 0.15, ease: 'power1.out' }, 0)
        .to(p, { x: runX, duration: dur, ease: 'power1.inOut' }, 0)
        .to(p, { y: -16, duration: dur / 9, ease: 'sine.inOut', yoyo: true, repeat: 8 }, 0)
        .to(p, { opacity: 0, duration: 0.15, ease: 'power1.in' }, dur - 0.15));
      maxEnd = Math.max(maxEnd, delay + dur);
      starIdx++;
    } else {
      const delay = 0.15 + extraIdx * 0.25;
      const dur = 1.3;
      gsap.set(p, { x: 0, scaleX: -1, opacity: 0 });
      tweens.push(gsap.timeline({ delay })
        .to(p, { opacity: 0.5, duration: 0.15, ease: 'power1.out' }, 0)
        .to(p, { x: runX, duration: dur, ease: 'power1.inOut' }, 0)
        .to(p, { opacity: 0, duration: 0.15, ease: 'power1.in' }, dur - 0.15));
      maxEnd = Math.max(maxEnd, delay + dur);
      extraIdx++;
    }
  });
  const stato = { curtain, herd, tweens };
  tweens.push(gsap.delayedCall(maxEnd + 0.1, () => { if (_transizione === stato) { herd.innerHTML = ''; _transizione = null; } }));
  _transizione = stato;
}

const ddMangime = d => { const p = (d || '').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}` : '—'; };
// una consegna: data, bolla (+ riga se la bolla ne ha più di una), kg o campo per il peso; conSoccida = nome allevamento davanti
function itemMangime(m, righe, conSoccida) {
  const piuRighe = m.riga > 1 || righe.some(x => x !== m && x.numero_documento === m.numero_documento);
  return `<div class="mangime-item"${m.quantita_provvisoria ? ' style="background:var(--amber-bg);"' : ''}>
      <div class="mangime-item-top"><span>${conSoccida ? `<b>${esc(etichetta(m.soccida || m.destinazione || '—'))}</b> · ` : ''}${ddMangime(m.data_consegna)} · bolla ${esc(m.numero_documento)}${piuRighe ? ' riga ' + esc(m.riga) : ''}</span><b>${m.quantita_provvisoria ? (conSoccida ? '' : 'peso da inserire') : fmt(m.quantita) + ' kg'}</b></div>
      <div class="mangime-item-desc">${esc(m.cod_articolo || '')}${m.descrizione ? ' — ' + esc(m.descrizione) : ''}</div>
      ${m.quantita_provvisoria ? `<div style="display:flex;gap:6px;margin-top:6px;">
        <input type="number" inputmode="numeric" id="mg-kg-${m.id}" class="field-input" style="margin:0;flex:1;" placeholder="kg scritti sulla bolla">
        <button class="btn-mort" style="margin:0;width:auto;padding:0 14px;background:var(--accent);" onclick="salvaPesoMangime(${m.id}, this)">✓ Salva</button>
      </div>` : ''}
    </div>`;
}

// ── PESI MANGIME DA INSERIRE: bolle partite a 1 kg delle soccide di Samuele (il peso è scritto a penna sul DDT).
// La mattina dopo l'export Samuele riceve la mail con le bolle nuove; quelle ancora senza peso dopo mezzogiorno vanno a Ilaria.
function apriPesi() {
  setNav('soccide');
  transizioneMandria(() => renderPesi());
}
function renderPesi() {
  vistaPesi = true;
  soccidaAttiva = null;
  const righe = allDaPesare.filter(m => m.quantita_provvisoria);
  document.getElementById('content').innerHTML = `<div class="detail-sticky-wrap">
      <button class="back-btn" onclick="vistaPesi = false; transizioneMandria(() => renderLista())">← Soccide</button>
      <div class="soccida-header"><div class="soccida-title">⚖️ PESI MANGIME DA INSERIRE</div></div>
    </div>
    <div style="font-size:12px;color:var(--text2);margin:0 2px 10px;">Bolle arrivate dall'export con peso 1 kg: scrivi i kg della bolla (DDT o Impresa).</div>` +
    (righe.length ? `<div class="mangime-wrap open"><div class="mangime-list" style="max-height:none;border-top:none;">${righe.map(m => itemMangime(m, righe, true)).join('')}</div></div>`
      : `<div class="empty">Nessuna bolla da pesare. ✓</div>`);
}

function renderMangimeRow(socId) {
  const righe = allMangime.filter(m => m.soccida_id === socId);
  if (!righe.length) {
    return `<div class="mangime-wrap"><div class="mangime-row" style="cursor:default;"><span>🌾 Mangime consegnato</span><span style="color:var(--text2);">nessuna consegna registrata</span></div></div>`;
  }
  const kg = m => m.quantita_provvisoria ? 0 : Number(m.quantita || 0);
  const lim30 = new Date(Date.now() - 30 * 86400000).toISOString().substring(0, 10);
  const tot30 = righe.filter(m => m.data_consegna >= lim30).reduce((s, m) => s + kg(m), 0);
  const ultimaData = righe[0].data_consegna;
  const totUltima = righe.filter(m => m.data_consegna === ultimaData).reduce((s, m) => s + kg(m), 0);
  const dd = ddMangime;

  const daPesare = righe.filter(m => m.quantita_provvisoria).length;
  const lista = righe.slice(0, 60).map(m => itemMangime(m, righe, false)).join('');

  return `<div class="mangime-wrap${mangimeAperto ? ' open' : ''}">
    <div class="mangime-row" onclick="mangimeAperto = this.parentNode.classList.toggle('open')">
      <span>🌾 Mangime consegnato</span>
      <span><b>${fmt(tot30)} kg</b> <span style="color:var(--text2);">30 gg · ultima ${dd(ultimaData)}${totUltima ? ` (${fmt(totUltima)} kg)` : ''}</span>${daPesare ? ` <span class="soc-badge badge-amber" style="white-space:nowrap;">${daPesare === 1 ? '1 peso' : daPesare + ' pesi'} da inserire</span>` : ''} <span class="mangime-arrow">›</span></span>
    </div>
    <div class="mangime-list">${lista}</div>
  </div>`;
}

// ── DETTAGLIO SOCCIDA ──
function mappeSoccida(socId) {
  return allMappe.filter(d => d.soccida_id === socId && /planimetria|mappa/i.test((d.sottocategoria || '') + ' ' + (d.titolo || '')));
}
function apriMappaSoccida(socId) {
  const mappe = mappeSoccida(socId);
  if (mappe.length === 1) { apriDocumento(mappe[0].documento_id); return; }
  const el = document.getElementById('mappa-list-' + socId);
  if (el) el.classList.toggle('open');
}

function render() {
  const soc = allSoccide.find(s => s.nome === soccidaAttiva);
  const content = document.getElementById('content');
  if (!soc) { renderLista(); return; }
  const mappe = mappeSoccida(soc.id);

  let html = `<div class="detail-sticky-wrap">
    <button class="back-btn" onclick="transizioneMandria(() => renderLista())">← Soccide</button>
    <div class="soccida-header">
      <div class="soccida-header-row">
        <div class="soccida-title">${esc(etichetta(soc.nome))}</div>
        ${mappe.length ? `<button type="button" class="btn-mappa" onclick="apriMappaSoccida(${soc.id})">🗺️ Mappa</button>` : ''}
      </div>
      ${mappe.length > 1 ? `<div class="mappa-list" id="mappa-list-${soc.id}">${mappe.map(d => `<button type="button" class="mappa-item" onclick="apriDocumento(${d.documento_id})">${esc(d.titolo || 'Planimetria')}</button>`).join('')}</div>` : ''}
    </div>
  </div>`;

  html += renderMangimeRow(soc.id);

  const lotti = allLotti.filter(l => l.soccida_id === soc.id);
  if (!lotti.length) {
    content.innerHTML = html + `<div class="empty">Nessun lotto attivo.</div>`;
    return;
  }

  lotti.forEach(lotto => {
    const ingLotto = allIngressi.filter(i => i.lotto_id === lotto.id).map(i => ({
      ...i, mediaRiga: (i.kg && i.capi) ? (i.kg / i.capi) : null
    })).sort((a, b) => a.data_ingresso.localeCompare(b.data_ingresso));
    const uscite = allUscite.filter(u => u.lotto_id === lotto.id);
    const mortLotto = allMortalita.filter(m => m.lotto_id === lotto.id);
    const c = contiLotto(lotto);
    const pesi = pesiLotto(lotto, ingLotto);
    const gg = giorniDa(lotto.data_ingresso);
    const tab = ['referti', 'note'].includes(tabAttiva[lotto.id]) ? tabAttiva[lotto.id] : 'mortalita';
    const refLotto = allSanitario.filter(r => r.lotto_id === lotto.id);
    const vis = t => t === tab ? '' : ' style="display:none;"';

    html += `<div class="lotto-header">
      <div>
        <div class="lotto-codice">Lotto ${esc(lotto.codice)}</div>
        <div class="lotto-sub">${esc(lotto.provenienza)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:15px;font-weight:600;font-family:var(--mono);">${fmtDate(lotto.data_ingresso)}</div>
        ${lotto.lettera_dop ? `<div style="font-size:13px;font-weight:700;color:var(--text);margin-top:2px;">LETTERA: ${esc(lotto.lettera_dop)}</div>` : ''}

    if (lotto.capannone) {
      html += `<div class="capannone-banner">📍 CAPANNONE: ${esc(String(lotto.capannone).toUpperCase())}</div>`;
    }

    const u = n => Math.abs(n) === 1 ? 'capo' : 'capi';
    html += `<div class="stat-grid">
      <div class="stat-box"><div class="stat-label">Capi entrati</div><div class="stat-val">${fmt(c.entrati)} <span class="stat-unit">${u(c.entrati)}</span></div></div>
      <div class="stat-box hl"><div class="stat-label">Presenti</div><div class="stat-val green">${fmt(c.presenti)} <span class="stat-unit">${u(c.presenti)}</span></div></div>
      <div class="stat-box"><div class="stat-label">Giorni</div><div class="stat-val">${fmt(gg)} <span class="stat-unit">gg</span></div></div>
      <div class="stat-box"><div class="stat-label">Peso arrivo</div><div class="stat-val">${pesi.arrivo !== null ? fmt(pesi.arrivo, 1) : '—'} <span class="stat-unit">kg</span></div></div>
      <div class="stat-box hl"><div class="stat-label">Peso stimato</div><div class="stat-val green">${pesi.oggi !== null ? fmt(pesi.oggi, 0) : '—'} <span class="stat-unit">kg</span></div></div>
      <div class="stat-box"><div class="stat-label">Mortalità</div><div class="stat-val" style="color:${c.morti > 0 ? 'var(--red)' : 'inherit'}">${fmt(c.morti)} <span class="stat-unit">${u(c.morti)}</span></div></div>
    </div>`;

    // INCREMENTO PONDERATO — barra fissa subito sotto i riquadri, come in index.html; tocco = modifica
    html += `<button class="incr-banner" type="button" onclick="apriFormIncremento(${lotto.id})">

      </div>`;

    // INGRESSO — sempre visibile, solo data + peso medio
    html += `<div class="section-label">Ingresso</div>`;
    if (ingLotto.length) {
      html += `<div class="simple-container">` + ingLotto.map(i => `<div class="simple-row">
          <span class="simple-date">${fmtDate(i.data_ingresso)}${i.capannone ? ` · ${esc(String(i.capannone).toUpperCase())}` : ''}${i.numero_ddt ? ` · DDT ${esc(i.numero_ddt)}` : ''}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${i.ddt_documento_id ? `<button class="btn-doc" onclick="apriDocumento(${i.ddt_documento_id})">📄 Bolla</button>` : ''}

        </div>`).join('') + `</div>`;
    } else if (lotto.media_ingresso) {
      html += `<div class="simple-container"><div class="simple-row">
        <span class="simple-date">${fmtDate(lotto.data_ingresso)}</span>
        <span style="display:flex;align-items:center;gap:6px;">
          ${lotto.ddt_ingresso_documento_id ? `<button class="btn-doc" onclick="apriDocumento(${lotto.ddt_ingresso_documento_id})">📄 Bolla</button>` : ''}
          <span class="simple-peso">${fmt(lotto.media_ingresso, 1)} kg</span>
        </span>
      </div></div>`;
    } else {
      html += `<div class="empty">Nessun dato di peso ingresso.</div>`;
    }

    // USCITE — capi, peso medio, giorni e incremento fatto (niente importi); la sezione compare solo se ci sono uscite
    if (uscite.length) {
      html += `<div class="section-label">Uscite</div>`;
      html += `<div class="uscite-container">` + uscite.map(u => {
        const media = (u.kg_totali && u.capi) ? u.kg_totali / u.capi : null;
        const gg = ggUscita(u, lotto), inc = incrUscita(u, lotto);
        return `<div class="uscita-row">
          <div class="uscita-top">
            <div class="uscita-date">${fmtDate(u.data_uscita)}${u.numero_ddt ? ` · DDT ${esc(u.numero_ddt)}` : ''}</div>
            ${u.ddt_documento_id ? `<button class="btn-doc" onclick="apriDocumento(${u.ddt_documento_id})">📄 Bolla</button>` : ''}
          </div>
          <div class="uscita-line">
            <div class="uc narrow"><div class="uc-label">capi</div><div class="uc-val">${fmt(u.capi)}</div></div>
            <div class="uc"><div class="uc-label">media kg</div><div class="uc-val">${media !== null ? fmt(media, 1) : '—'}</div></div>
            <div class="uc narrow"><div class="uc-label">gg</div><div class="uc-val">${gg ?? '—'}</div></div>
            <div class="uc"><div class="uc-label">incr. kg/gg</div><div class="uc-val green">${inc !== null ? fmt(inc, 3) : '—'}</div></div>
          </div>
        </div>`;
      }).join('') + `</div>`;
    }

    // TABBAR Mortalità / Incremento / Note
    const noteLotto = allNoteVet.filter(n => n.lotto_id === lotto.id)
      .sort((a, b) => b.data_nota.localeCompare(a.data_nota) || (b.id || 0) - (a.id || 0));
    html += `<div style="display:flex;gap:4px;margin:12px 0 10px;">
      ${[['mortalita', `Mortalità${mortLotto.length ? ' (' + mortLotto.length + ')' : ''}`], ['referti', `Referti${refLotto.length ? ' (' + refLotto.length + ')' : ''}`], ['note', `Note${noteLotto.length ? ' (' + noteLotto.length + ')' : ''}`]]
        .map(([t, label]) => `<button onclick="switchTab(${lotto.id},'${t}')" class="ltab${t === tab ? ' ltab-active' : ''}" data-lotto="${lotto.id}" data-tab="${t}">${label}</button>`).join('')}
    </div>`;

    // TAB MORTALITA — inserimento + elenco
    html += `<div id="ltab-mortalita-${lotto.id}"${vis('mortalita')}>
      <button class="btn-mort" onclick="apriFormMortalita(${lotto.id})">🔴 Registra mortalità</button>
      <div id="form-mortalita-${lotto.id}" style="display:none;" class="form-box">
        <div class="field-label">DATA</div>
        <input type="date" id="m-data-${lotto.id}" class="field-input">
        <div class="field-label">N° CAPI MORTI</div>
        <input type="number" inputmode="numeric" id="m-capi-${lotto.id}" class="field-input" placeholder="es. 2" min="1">
        <div class="field-label">TRATTAMENTO (opz.)</div>
        <input type="text" id="m-tratt-${lotto.id}" class="field-input" placeholder="es. AMO, STR, FLO…">
        <div class="field-label">NOTE (opz.)</div>
        <input type="text" id="m-note-${lotto.id}" class="field-input" placeholder="es. 15 scarti arrivo">
        <button class="btn-mort" style="margin-bottom:0;" onclick="salvaMortalita(${lotto.id}, this)">✓ Salva</button>
      </div>`;
    if (mortLotto.length) {
      html += `<div class="simple-container lista-scroll mort">` + mortLotto.map(m => `<div class="simple-row">
          <div>
            <div class="simple-date">${fmtDate(m.data_evento)}</div>

          </div>
          <span class="simple-peso" style="color:var(--red);white-space:nowrap;">${capi(m.capi_morti || 0)}</span>
        </div>`).join('') + `</div>`;
      if (mortLotto.length > 4) html += `<div class="lista-conta">${mortLotto.length} registrazioni · ${capi(c.morti)} · scorri nel riquadro</div>`;
    } else {
      html += `<div class="empty">Nessuna mortalità registrata.</div>`;
    }
    html += `</div>`;

    // TAB REFERTI IZS — sola lettura, come la scheda Referti di index.html (data, esito, PDF)
    html += `<div id="ltab-referti-${lotto.id}"${vis('referti')}>`;
    if (refLotto.length) {
      html += `<div class="lista-scroll note">` + refLotto.map(r => `<div style="padding:8px 10px;background:var(--bg2);border-radius:var(--radius);margin-bottom:4px;border:0.5px solid var(--border);">
          <div style="font-size:10px;color:var(--text2);font-family:var(--mono);">${fmtDate(r.data_referto)}</div>
          <div style="font-size:12px;margin-top:2px;overflow-wrap:anywhere;">${esc(r.patologia || '—')}</div>
          ${r.referto_documento_id ? `<button onclick="apriDocumento(${r.referto_documento_id})" style="margin-top:6px;background:#FFF;border:0.5px solid var(--border);border-radius:10px;padding:3px 10px;font-size:11px;color:var(--text2);cursor:pointer;font-family:var(--font);">📄 Apri referto PDF</button>` : ''}
        </div>`).join('') + `</div>`;
    } else {
      html += `<div class="empty">Nessun referto IZS registrato.</div>`;
    }
    html += `</div>`;

    // TAB NOTE — inserimento + elenco (stessa tabella note_veterinario di index.html/veterinario.html)
    html += `<div id="ltab-note-${lotto.id}"${vis('note')}>
      <button class="btn-mort" style="background:var(--accent);" onclick="apriFormNota(${lotto.id})">📝 Inserisci nota</button>

        <div class="field-label">DATA</div>

        <div class="field-label">NOTA</div>
        <textarea id="n-testo-${lotto.id}" class="field-input" rows="3" style="resize:vertical;font-family:var(--font);" placeholder="Scrivi qui la nota..."></textarea>
        <button class="btn-mort" style="margin-bottom:0;background:var(--accent);" onclick="salvaNota(${lotto.id}, this)">✓ Salva</button>
      </div>`;
    if (noteLotto.length) {
      html += `<div class="simple-container lista-scroll note">` + noteLotto.map(n => `<div class="simple-row" style="display:block;">
          <div class="simple-date">${fmtDate(n.data_nota)}</div>
          ${n.testo ? `<div style="font-size:12px;color:var(--text);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;">${esc(n.testo)}</div>` : ''}
          ${notaMediaRender(n)}
        </div>`).join('') + `</div>`;
    } else {
      html += `<div class="empty">Nessuna nota registrata.</div>`;
    }
    html += `</div>`;

    html += `<div style="border-top:1px solid var(--border);margin:16px 0"></div>`;
  });

  content.innerHTML = html;
  limitaMortalita();
}

// elenco mortalità alto 4 righe (le righe con la nota sono più alte, quindi misuro quelle vere)
// più un filo della quinta, così si capisce che scorre
function limitaMortalita() {
  document.querySelectorAll('.lista-scroll.mort').forEach(el => {
    const righe = [...el.children];
    if (righe.length <= 4 || !el.offsetParent) return;
    el.style.maxHeight = (righe.slice(0, 4).reduce((s, r) => s + r.offsetHeight, 0) + 14) + 'px';
  });
}

function switchTab(lottoId, tab) {
  tabAttiva[lottoId] = tab;
  ['mortalita', 'referti', 'note'].forEach(t => {
    const el = document.getElementById(`ltab-${t}-${lottoId}`);
    if (el) el.style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll(`.ltab[data-lotto="${lottoId}"]`).forEach(b => {
    b.classList.toggle('ltab-active', b.dataset.tab === tab);
  });
  if (tab === 'mortalita') limitaMortalita();
}

// apre/chiude un modulo; all'apertura propone la data di oggi e mette il cursore sul primo campo utile
function apriModulo(formId, dataId, focusId) {
  const form = document.getElementById(formId);
  const apri = form.style.display === 'none';
  form.style.display = apri ? 'block' : 'none';
  if (!apri) return;
  if (dataId) document.getElementById(dataId).value = oggiISO();
  const f = document.getElementById(focusId);
  if (f) setTimeout(() => f.focus(), 50);
}
function apriFormMortalita(id) { apriModulo(`form-mortalita-${id}`, `m-data-${id}`, `m-capi-${id}`); }
function apriFormNota(id) { apriModulo(`form-nota-${id}`, `n-data-${id}`, `n-testo-${id}`); }
function apriFormIncremento(id) { apriModulo(`form-incremento-${id}`, null, `i-val-${id}`); }

// salvataggio con il bottone bloccato finché il server non risponde (niente righe doppie col doppio tocco)
async function invia(btn, lavoro) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.dataset.testo = btn.textContent; btn.textContent = 'Salvataggio…'; }
  try { await lavoro(); }
  catch (e) { showToast('Errore: ' + (e.message || e), false); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.testo; } }
}
async function postRiga(tabella, riga) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabella}`, { method: 'POST', headers: SB_H, body: JSON.stringify(riga) });
  if (!r.ok) throw new Error(await r.text());
  const j = await r.json();
  return Array.isArray(j) ? j[0] : j;
}

function salvaMortalita(lottoId, btn) {
  const data = document.getElementById(`m-data-${lottoId}`).value;
  const n = parseInt(document.getElementById(`m-capi-${lottoId}`).value, 10) || 0;
  const tratt = document.getElementById(`m-tratt-${lottoId}`).value.trim() || null;
  const note = document.getElementById(`m-note-${lottoId}`).value.trim() || null;
  if (!data || n <= 0) { showToast('Inserisci data e numero capi morti', false); return; }
  const lotto = allLotti.find(l => l.id === lottoId);
  const soc = allSoccide.find(s => s.id === lotto.soccida_id);
  return invia(btn, async () => {
    const nuova = await postRiga('mortalita', {
      lotto_id: lottoId, soccida: soc.nome, data_evento: data,
      lettera_dop: lotto.lettera_dop || null, capi_morti: n, trattamento: tratt, note,
    });
    allMortalita.push(nuova);
    allMortalita.sort((a, b) => b.data_evento.localeCompare(a.data_evento) || (b.id || 0) - (a.id || 0));
    tabAttiva[lottoId] = 'mortalita';
    render();
    showToast(`✓ Mortalità registrata — ${n === 1 ? '1 capo' : n + ' capi'} il ${fmtDate(data)}`, true);
  });
}

function salvaNota(lottoId, btn) {
  const data = document.getElementById(`n-data-${lottoId}`).value;
  const testo = document.getElementById(`n-testo-${lottoId}`).value.trim();
  if (!data || !testo) { showToast('Inserisci data e testo della nota', false); return; }
  const lotto = allLotti.find(l => l.id === lottoId);
  const soc = allSoccide.find(s => s.id === lotto.soccida_id);
  return invia(btn, async () => {
    const nuova = await postRiga('note_veterinario', { lotto_id: lottoId, soccida: soc.nome, data_nota: data, testo });
    allNoteVet.push(nuova);
    tabAttiva[lottoId] = 'note';
    render();
    showToast(`✓ Nota registrata — ${fmtDate(data)}`, true);
  });
}

// peso vero di una bolla partita a 1 kg (stessi limiti delle risposte di Ilaria: 200-40.000 kg)
function salvaPesoMangime(id, btn) {
  const kg = parseFloat(String(document.getElementById(`mg-kg-${id}`).value).replace(',', '.'));
  if (isNaN(kg) || kg < 200 || kg > 40000) { showToast('Inserisci i kg della bolla (tra 200 e 40.000)', false); return; }
  const m = allMangime.find(x => x.id === id) || allDaPesare.find(x => x.id === id);
  return invia(btn, async () => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/consegne_mangime?id=eq.${id}&quantita_provvisoria=eq.true`, {
      method: 'PATCH', headers: SB_H,
      body: JSON.stringify({ quantita: kg, quantita_precedente: m ? m.quantita : null, quantita_provvisoria: false, aggiornato_at: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    if (!Array.isArray(j) || !j.length) throw new Error('peso già inserito da qualcun altro, ricarica la pagina');
    [allMangime, allDaPesare].forEach(l => l.filter(x => x.id === id).forEach(x => Object.assign(x, { quantita: kg, quantita_provvisoria: false })));
    if (vistaPesi) renderPesi(); else { mangimeAperto = true; render(); }
    showToast(`✓ Peso salvato — bolla ${m ? m.numero_documento : ''}: ${fmt(kg)} kg`, true);
  });
}

function salvaIncremento(lottoId, btn) {
  const val = parseFloat(String(document.getElementById(`i-val-${lottoId}`).value).replace(',', '.'));
  if (isNaN(val) || val <= 0 || val > 2) { showToast('Inserisci un valore valido (es. 0.750)', false); return; }
  return invia(btn, async () => {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/lotti?id=eq.${lottoId}`, {
      method: 'PATCH', headers: SB_H, body: JSON.stringify({ incremento_giornaliero: val }),
    });
    if (!r.ok) throw new Error(await r.text());
    allLotti.find(l => l.id === lottoId).incremento_giornaliero = val;
    render();
    showToast(`✓ Incremento aggiornato — ${fmt(val, 3)} kg/gg`, true);
  });
}

loadAll();
</script>
