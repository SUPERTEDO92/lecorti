<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Corti — Samuele</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samuele">
<meta name="theme-color" content="#1A1A18">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE; --bg2: #EDEAE3; --bg3: #E3DFD6;
    --text: #1A1A18; --text2: #6B6B66; --text3: #9C9C96;
    --accent: #C17B2A; --accent2: #E8A84A;
    --green: #2A7A4A; --green-bg: #E8F5EE;
    --amber: #9A6010; --amber-bg: #FDF3E0;
    --red: #A03030; --red-bg: #FCEAEA;
    --border: #D4D0C8; --border2: #C4C0B8;
    --font: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
    --radius: 6px; --radius-lg: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; padding-bottom: 40px; }

  .topbar { position: sticky; top: 0; z-index: 100; background: var(--text); color: #F5F3EE; padding: 12px 20px 10px; }
  .topbar-logo { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .1em; }
  .topbar-date { font-size: 11px; color: #888; font-family: var(--mono); margin-top: 2px; }

  .container { max-width: 480px; margin: 0 auto; padding: 14px 14px 0; }

  /* Lista soccide, come home index */
  .soccide-list { display: flex; flex-direction: column; gap: 2px; }
  .soccida-card {
    background: #FFF; border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: all .12s;
  }
  .soccida-card:hover { border-color: var(--border2); background: var(--bg2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--accent); }
  .dot-gray { background: var(--text3); }
  .soc-main { flex: 1; min-width: 0; }
  .soc-nome { font-size: 14px; font-weight: 500; }
  .soc-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .soc-badge { font-size: 10px; font-family: var(--mono); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-gray { background: var(--bg3); color: var(--text2); }
  .soc-arrow { color: var(--text3); font-size: 18px; }

  /* Header sticky pagina dettaglio */
  .detail-sticky-wrap { position: sticky; top: 0; z-index: 90; background: var(--bg); padding-bottom: 4px; margin: -14px -14px 10px; padding-left: 14px; padding-right: 14px; padding-top: 14px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: #FFF; cursor: pointer;
    background: #2A6B8A; border: none; font-family: var(--font);
    padding: 7px 13px; border-radius: var(--radius); margin-bottom: 8px;
  }
  .soccida-header { background: var(--text); color: #F5F3EE; border-radius: var(--radius-lg); padding: 10px 16px; }
  .soccida-title { font-size: 17px; font-weight: 500; font-family: var(--mono); }

  .lotto-header {
    background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .lotto-codice { font-size: 17px; font-weight: 600; font-family: var(--mono); }
  .lotto-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }

  .capannone-banner { background: var(--text); color: #FFF; border-radius: var(--radius); padding: 9px 14px; margin-bottom: 8px; text-align: center; font-size: 13px; font-weight: 700; font-family: var(--mono); letter-spacing: .05em; }

  .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; margin-bottom: 10px; }
  .stat-box { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 10px 12px; }
  .stat-box.hl { background: var(--green-bg); border-color: #B8DECA; }
  .stat-label { font-size: 10px; color: var(--text2); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
  .stat-val { font-size: 18px; font-weight: 500; color: var(--text); margin-top: 2px; }
  .stat-val.green { color: var(--green); }
  .stat-unit { font-size: 11px; color: var(--text2); font-weight: 300; }

  .section-label { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin: 12px 0 6px; }

  .ltab { flex: 1; padding: 8px 4px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 12px; font-family: var(--font); font-weight: 500; cursor: pointer; }
  .ltab-active { border-color: var(--accent) !important; background: var(--accent) !important; color: #FFF !important; }

  .simple-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 0.5px solid var(--border); background: #FFF; }
  .simple-row:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .simple-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .simple-container { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; }
  .simple-date { font-size: 13px; font-family: var(--mono); font-weight: 500; }
  .simple-peso { font-size: 15px; font-weight: 600; font-family: var(--mono); color: var(--text); }

  .empty { text-align: center; padding: 24px; color: var(--text3); font-size: 12px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 13px; font-family: var(--mono); }

  .btn-mort { width: 100%; padding: 12px; background: var(--red); color: #FFF; border: none; border-radius: var(--radius-lg); font-size: 13px; font-family: var(--font); font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .field-label { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-bottom: 4px; }
  .field-input { width: 100%; padding: 9px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font); background: var(--bg); margin-bottom: 8px; }
  .form-box { background: #FFF; border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }

  .incr-bar { background: var(--accent); color: #FFF; border-radius: var(--radius-lg); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .incr-val { font-size: 16px; font-weight: 600; font-family: var(--mono); }
  .incr-edit-btn { background: rgba(255,255,255,0.2); border: none; color: #FFF; padding: 6px 12px; border-radius: var(--radius); font-size: 12px; font-family: var(--font); cursor: pointer; }

  .toast { display: none; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 12px; font-size: 13px; }
  .toast.ok { background: var(--green-bg); color: var(--green); border: 0.5px solid #B8DECA; }
  .toast.err { background: var(--red-bg); color: var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">LE CORTI — SAMUELE</div>
  <div class="topbar-date" id="topbar-date"></div>
</div>

<div class="container">
  <div id="toast" class="toast"></div>
  <div id="content"><div class="loading">Caricamento dati…</div></div>
</div>

<script src="lecorti-shared.js"></script>
<script>
const SOCCIDE_MOSTRATE = ['FILIPPINI', 'MIGLIORATI', 'SCARATTI'];

let allSoccide = [], allLotti = [], allUscite = [], allMortalita = [], allIngressi = [];
let soccidaAttiva = null;

document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('it-IT');

async function loadAll() {
  allSoccide = await sb('soccide', `?nome=in.(${SOCCIDE_MOSTRATE.map(n=>encodeURIComponent(n)).join(',')})`);
  const socIds = allSoccide.map(s => s.id);
  if(!socIds.length) {
    document.getElementById('content').innerHTML = '<div class="empty">Nessuna soccida trovata.</div>';
    return;
  }

  allLotti = await sb('lotti', `?soccida_id=in.(${socIds.join(',')})&attivo=eq.true&order=data_ingresso.asc`);
  const lottiIds = allLotti.map(l => l.id);

  [allUscite, allMortalita, allIngressi] = await Promise.all([
    lottiIds.length ? sb('uscite', `?lotto_id=in.(${lottiIds.join(',')})&order=data_uscita.asc`) : [],
    lottiIds.length ? sb('mortalita', `?lotto_id=in.(${lottiIds.join(',')})&order=data_evento.desc`) : [],
    lottiIds.length ? sb('lotti_ingressi', `?lotto_id=in.(${lottiIds.join(',')})&order=data_ingresso.asc`) : [],
  ]);

  renderLista();
}

// ── LISTA SOCCIDE (come home di index) ──
function renderLista() {
  soccidaAttiva = null;
  const html = `<div class="soccide-list">${SOCCIDE_MOSTRATE.map(nome => {
    const soc = allSoccide.find(s => s.nome === nome);
    if(!soc) return '';
    const lotti = allLotti.filter(l => l.soccida_id === soc.id);
    if(!lotti.length) {
      return `<div class="soccida-card" style="opacity:0.5;cursor:default;">
        <div class="dot dot-gray"></div>
        <div class="soc-main"><div class="soc-nome">${nome}</div><div class="soc-meta">nessun lotto attivo</div></div>
      </div>`;
    }
    const totPresenti = lotti.reduce((tot, lotto) => {
      const capiUsciti = allUscite.filter(u => u.lotto_id === lotto.id).reduce((s,u) => s+(u.capi||0), 0);
      const capiMorti = allMortalita.filter(m => m.lotto_id === lotto.id).reduce((s,m) => s+(m.capi_morti||0), 0);
      const ing = allIngressi.filter(i => i.lotto_id === lotto.id);
      const base = ing.length ? ing.reduce((s,i)=>s+(i.capi||0),0) : (lotto.capi_entrati||0);
      return tot + base - capiUsciti - capiMorti;
    }, 0);
    const dot = totPresenti > 50 ? 'dot-green' : totPresenti > 10 ? 'dot-amber' : 'dot-gray';
    const badge = totPresenti > 50 ? 'badge-green' : totPresenti > 0 ? 'badge-amber' : 'badge-gray';
    const badgeText = totPresenti > 50 ? 'attivo' : totPresenti > 0 ? 'in uscita' : 'concluso';
    const metaLotti = lotti.length > 1 ? `${lotti.length} lotti · ` : (lotti[0].codice + ' · ');
    const lettere = [...new Set(lotti.map(l => l.lettera_dop).filter(Boolean))].join(', ');

    return `<div class="soccida-card" onclick="apriSoccida('${nome}')">
      <div class="dot ${dot}"></div>
      <div class="soc-main">
        <div class="soc-nome">${nome}</div>
        <div class="soc-meta">${metaLotti}${fmt(totPresenti)} capi${lettere ? ' · ' + lettere : ''}</div>
      </div>
      <span class="soc-badge ${badge}">${badgeText}</span>
      <span class="soc-arrow">&#8250;</span>
    </div>`;
  }).join('')}</div>`;
  document.getElementById('content').innerHTML = html;
}

function apriSoccida(nome) {
  soccidaAttiva = nome;
  render();
}

// ── DETTAGLIO SOCCIDA ──
function render() {
  const soc = allSoccide.find(s => s.nome === soccidaAttiva);
  const content = document.getElementById('content');
  if(!soc) { renderLista(); return; }

  let html = `<div class="detail-sticky-wrap">
    <button class="back-btn" onclick="renderLista()">← Soccide</button>
    <div class="soccida-header"><div class="soccida-title">${soc.nome}</div></div>
  </div>`;

  const lotti = allLotti.filter(l => l.soccida_id === soc.id);
  if(!lotti.length) {
    html += `<div class="empty">Nessun lotto attivo.</div>`;
    content.innerHTML = html;
    return;
  }

  const oggi = new Date();

  lotti.forEach(lotto => {
    const ingLotto = allIngressi.filter(i => i.lotto_id === lotto.id).map(i => ({
      ...i, mediaRiga: (i.kg && i.capi) ? (i.kg / i.capi) : null
    })).sort((a,b) => a.data_ingresso.localeCompare(b.data_ingresso));

    const uscite = allUscite.filter(u => u.lotto_id === lotto.id);
    const mortLotto = allMortalita.filter(m => m.lotto_id === lotto.id);
    const capiMorti = mortLotto.reduce((s,m) => s+(m.capi_morti||0), 0);
    const capiUsciti = uscite.reduce((s,u) => s+(u.capi||0), 0);
    const totIng = ingLotto.length ? ingLotto.reduce((s,i)=>s+(i.capi||0),0) : (lotto.capi_entrati||0);
    const presenti = totIng - capiMorti - capiUsciti;
    const gg = Math.floor((oggi - new Date(lotto.data_ingresso)) / 86400000);

    html += `<div class="lotto-header">
      <div>
        <div class="lotto-codice">Lotto ${lotto.codice}</div>
        <div class="lotto-sub">${lotto.provenienza || ''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:15px;font-weight:600;font-family:var(--mono);">${fmtDate(lotto.data_ingresso)}</div>
        ${lotto.lettera_dop ? `<div style="font-size:13px;font-weight:700;color:var(--text);margin-top:2px;">LETTERA: ${lotto.lettera_dop}</div>` : ''}
      </div>
    </div>`;

    if(lotto.capannone) {
      html += `<div class="capannone-banner">📍 CAPANNONE: ${lotto.capannone.toUpperCase()}</div>`;
    }

    html += `<div class="stat-grid">
      <div class="stat-box"><div class="stat-label">Capi entrati</div><div class="stat-val">${fmt(totIng)} <span class="stat-unit">capi</span></div></div>
      <div class="stat-box hl"><div class="stat-label">Presenti stimati</div><div class="stat-val green">${fmt(presenti)} <span class="stat-unit">capi</span></div></div>
      <div class="stat-box"><div class="stat-label">Giorni in stalla</div><div class="stat-val">${gg} <span class="stat-unit">gg</span></div></div>
      <div class="stat-box"><div class="stat-label">Mortalità</div><div class="stat-val" style="color:${capiMorti > 0 ? 'var(--red)' : 'inherit'}">${capiMorti} <span class="stat-unit">capi</span></div></div>
    </div>`;

    // INGRESSO — sempre visibile, solo data + peso medio
    html += `<div class="section-label">Ingresso</div>`;
    if(ingLotto.length) {
      html += `<div class="simple-container">`;
      ingLotto.forEach(i => {
        html += `<div class="simple-row">
          <span class="simple-date">${fmtDate(i.data_ingresso)}${i.capannone ? ` · ${i.capannone.toUpperCase()}` : ''}${i.numero_ddt ? ` · DDT ${i.numero_ddt}` : ''}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${i.ddt_documento_id ? `<button onclick="apriDocumento(${i.ddt_documento_id})" style="background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text2);cursor:pointer;font-family:var(--font);">📄 Bolla</button>` : ''}
            <span class="simple-peso">${i.mediaRiga !== null ? fmt(i.mediaRiga,1) + ' kg' : '—'}</span>
          </span>
        </div>`;
      });
      html += `</div>`;
    } else if(lotto.media_ingresso) {
      html += `<div class="simple-container"><div class="simple-row">
        <span class="simple-date">${fmtDate(lotto.data_ingresso)}</span>
        <span class="simple-peso">${fmt(lotto.media_ingresso,1)} kg</span>
      </div></div>`;
    } else {
      html += `<div class="empty">Nessun dato di peso ingresso.</div>`;
    }

    // USCITE — sempre visibile, solo data + peso medio
    html += `<div class="section-label">Uscite</div>`;
    if(uscite.length) {
      html += `<div class="simple-container">`;
      uscite.forEach(u => {
        const mediaU = (u.kg_totali && u.capi) ? (u.kg_totali / u.capi) : null;
        html += `<div class="simple-row">
          <span class="simple-date">${fmtDate(u.data_uscita)}${u.numero_ddt ? ` · DDT ${u.numero_ddt}` : ''}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            ${u.ddt_documento_id ? `<button onclick="apriDocumento(${u.ddt_documento_id})" style="background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--text2);cursor:pointer;font-family:var(--font);">📄 Bolla</button>` : ''}
            <span class="simple-peso">${mediaU !== null ? fmt(mediaU,1) + ' kg' : '—'}</span>
          </span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="empty">Nessuna uscita registrata.</div>`;
    }

    // TABBAR solo Mortalità / Incremento
    html += `<div style="display:flex;gap:4px;margin:12px 0 10px;">
      <button onclick="switchTab(${lotto.id},'mortalita',this)" class="ltab ltab-active" data-lotto="${lotto.id}">Mortalità</button>
      <button onclick="switchTab(${lotto.id},'incremento',this)" class="ltab" data-lotto="${lotto.id}">Incremento</button>
    </div>`;

    // TAB MORTALITA — inserimento + elenco
    html += `<div id="ltab-mortalita-${lotto.id}">`;
    html += `<button class="btn-mort" onclick="apriFormMortalita(${lotto.id})">🔴 Registra mortalità</button>`;
    html += `<div id="form-mortalita-${lotto.id}" style="display:none;" class="form-box">
      <div class="field-label">DATA</div>
      <input type="date" id="m-data-${lotto.id}" class="field-input">
      <div class="field-label">N° CAPI MORTI</div>
      <input type="number" id="m-capi-${lotto.id}" class="field-input" placeholder="es. 2" min="0">
      <div class="field-label">TRATTAMENTO (opz.)</div>
      <input type="text" id="m-tratt-${lotto.id}" class="field-input" placeholder="es. AMO, STR, FLO…">
      <div class="field-label">NOTE (opz.)</div>
      <input type="text" id="m-note-${lotto.id}" class="field-input" placeholder="es. 15 scarti arrivo">
      <button class="btn-mort" style="margin-bottom:0;" onclick="salvaMortalita(${lotto.id})">✓ Salva</button>
    </div>`;
    if(mortLotto.length) {
      html += `<div class="simple-container">`;
      mortLotto.forEach(m => {
        html += `<div class="simple-row">
          <div>
            <div class="simple-date">${fmtDate(m.data_evento)}</div>
            ${(m.trattamento || m.note) ? `<div style="font-size:10px;color:var(--text2);margin-top:2px;">${m.trattamento ? 'Tratt. ' + m.trattamento : ''}${m.note ? (m.trattamento ? ' · ' : '') + m.note : ''}</div>` : ''}
          </div>
          <span class="simple-peso" style="color:var(--red);">${m.capi_morti || 0} capi</span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="empty">Nessuna mortalità registrata.</div>`;
    }
    html += `</div>`;

    // TAB INCREMENTO — visualizza + modifica
    html += `<div id="ltab-incremento-${lotto.id}" style="display:none;">`;
    html += `<div class="incr-bar">
      <div>
        <div style="font-size:10px;opacity:0.8;font-family:var(--mono);text-transform:uppercase;">Incremento giornaliero ponderato</div>
        <div class="incr-val">${lotto.incremento_giornaliero != null ? fmt(lotto.incremento_giornaliero,3) + ' kg/gg' : '—'}</div>
      </div>
      <button class="incr-edit-btn" onclick="apriFormIncremento(${lotto.id})">✎ modifica</button>
    </div>`;
    html += `<div id="form-incremento-${lotto.id}" style="display:none;" class="form-box">
      <div class="field-label">NUOVO INCREMENTO PONDERATO (kg/gg)</div>
      <input type="number" step="0.001" id="i-val-${lotto.id}" class="field-input" value="${lotto.incremento_giornaliero || ''}" placeholder="es. 0.750">
      <button class="btn-mort" style="margin-bottom:0;background:var(--accent);" onclick="salvaIncremento(${lotto.id})">✓ Salva</button>
    </div>`;
    html += `</div>`;

    html += `<div style="border-top:1px solid var(--border);margin:16px 0"></div>`;
  });

  content.innerHTML = html;
}

function switchTab(lottoId, tab, btn) {
  ['mortalita','incremento'].forEach(t => {
    const el = document.getElementById(`ltab-${t}-${lottoId}`);
    if(el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll(`.ltab[data-lotto="${lottoId}"]`).forEach(b => {
    b.classList.toggle('ltab-active', b === btn);
  });
}

function apriFormMortalita(lottoId) {
  const form = document.getElementById(`form-mortalita-${lottoId}`);
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  document.getElementById(`m-data-${lottoId}`).value = new Date().toISOString().split('T')[0];
}

async function salvaMortalita(lottoId) {
  const data = document.getElementById(`m-data-${lottoId}`).value;
  const capi = parseInt(document.getElementById(`m-capi-${lottoId}`).value) || 0;
  const tratt = document.getElementById(`m-tratt-${lottoId}`).value || null;
  const note = document.getElementById(`m-note-${lottoId}`).value || null;
  if(!data || capi <= 0) { showToast('Inserisci data e numero capi morti', false); return; }

  const lotto = allLotti.find(l => l.id === lottoId);
  const soc = allSoccide.find(s => s.id === lotto.soccida_id);

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/mortalita`, {
      method: 'POST', headers: SB_H,
      body: JSON.stringify({
        lotto_id: lottoId, soccida: soc.nome, data_evento: data,
        lettera_dop: lotto.lettera_dop || null, capi_morti: capi,
        trattamento: tratt, note
      })
    });
    if(!r.ok) throw new Error(await r.text());
    const nuova = await r.json();
    allMortalita.push(Array.isArray(nuova) ? nuova[0] : nuova);
    showToast(`✓ Mortalità registrata — ${capi} capi il ${fmtDate(data)}`, true);
    render();
  } catch(e) {
    showToast('Errore: ' + e.message, false);
  }
}

function apriFormIncremento(lottoId) {
  const form = document.getElementById(`form-incremento-${lottoId}`);
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function salvaIncremento(lottoId) {
  const val = parseFloat(document.getElementById(`i-val-${lottoId}`).value);
  if(isNaN(val) || val <= 0) { showToast('Inserisci un valore valido', false); return; }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/lotti?id=eq.${lottoId}`, {
      method: 'PATCH', headers: SB_H,
      body: JSON.stringify({ incremento_giornaliero: val })
    });
    if(!r.ok) throw new Error(await r.text());
    const lotto = allLotti.find(l => l.id === lottoId);
    lotto.incremento_giornaliero = val;
    showToast(`✓ Incremento aggiornato — ${fmt(val,3)} kg/gg`, true);
    render();
  } catch(e) {
    showToast('Errore: ' + e.message, false);
  }
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  t.style.display = 'block';
  if(ok) setTimeout(() => t.style.display = 'none', 4000);
}

loadAll();
</script>
